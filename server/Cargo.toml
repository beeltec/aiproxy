[package]
name = "aiproxy"
version = "0.1.1"
edition = "2024"
license = "MIT"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4.45"
chrono-tz = "0.10.4"
croner = "4.0.0"
eventsource-stream = "0.2.3"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
ipnet = "2.12.2"
libc = "0.2.189"
openssl = { version = "0.10.81", features = ["vendored"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "http2", "form", "query", "multipart"] }
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "json"] }
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "isomp4", "mkv", "mp3", "mpa", "ogg", "wav"] }
thiserror = "2.0.21"
tiktoken-rs = "0.12.1"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
totp-rs = { version = "6.0.0", features = ["otpauth", "qr", "gen_secret"] }
tower-http = { version = "0.7.1", features = ["trace", "set-header", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.26.1", features = ["v4"] }
webauthn-rs = { version = "0.5.5", features = ["conditional-ui"] }
webauthn-rs-proto = "0.5.5"
